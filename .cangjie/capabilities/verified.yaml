- capability_id: cap.photo-vision.sequence-edit
  revision: 2
  status: active
  slug: sequence-edit
  title: 序列编排：色彩弧、减法与专有意义
  importance: high
  importance_rationale: 前九本书全部在讲单张（怎么拍、怎么评、怎么配色），没有一本回答「一批照片怎么排」。批五的 Pixar colorscript 正好是唯一系统化讲这件事的材料：它把全片色彩压成一条胶片，靠换调色板制造起伏。批七的曼特又补了组照张数、整组评判与连续摄影三条可操作判据。缺了它，包只能评单张、不能评作品。
  one_liner: 先定用途与读者，再把每张压成只看色与明暗，读出当前弧的方向，定一对贯穿的对抗关系，做减法与位移，最后收成一句弧的描述加三条动作。
  intents:
  - 一批照片怎么排顺序
