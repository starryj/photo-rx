  - source_id: src-mant
    location: 摄影构图与色彩设计 p122、p127、p128、p130、p131、p133、p137、p147、p150
  - source_id: src-sense-of-order
    location: 秩序感 p172（相邻色的同时对比）
  promotion:
    destination: promoted
    gate:
      independent_intent: true
      independent_contract: true
      independent_run: true
      independent_reuse: true
      independent_eval: true
    notes: 批一唯一晋级能力；批二补入歌德亮度赋值与通道混合两条，revision 升到 2。独立意图＝「色彩关系成立吗」；独立契约＝事实表＋主导对比＋数量＋路径＋失效条件；独立运行＝可用单张照片走完六步；复用＝同一流程用于定配色与统一基调；评测＝24 条触发用例 + 16 条输出断言。
- capability_id: cap.photo-vision.structure-read
  revision: 3
  status: active
  slug: structure-read
  title: 画面骨架读取
  importance: critical
  importance_rationale: 批二新增、批七补入曼特点线面计数与八等分的结构能力；它承接《摄影师的视界》与曼特《摄影构图与色彩设计》的可操作部分，回答的是「这张照片靠什么立住、哪里散」，是色彩诊断之外另一半判断，缺它则所有非色彩的问题（空、挤、平、剪裁、机位）都无处安放。批八又补入《秩序感》的显著点与边框中断，用来解释「为什么这处先被看见」。
  one_liner: 画幅→分割→元素→关系→纵深→引导，六段各给判据与一个可数的量。
  intents:
  - 诊断一张照片的结构问题
  - 判断主体该放哪、偏离中心要不要理由
  - 决定横竖与画幅
  - 判断地平线高低与剪裁取舍
  - 判断画面是节奏还是图案
  - 判断纵深与视觉引导是否成立
  keywords:
  - 构图
  - 骨架
  - 画幅
  - 分割
  - 平衡
  - 节奏
  - 纵深
  - composition
  - framing
  - visual weight
  also_read:
  - color-decision
  - shoot-plan
  card: cards/structure-read.md
  frontmatter:
    description: 当用户拿一张照片说「看着有点乱／散／挤／平／空」，或问主体放哪、横竖怎么选、地平线放多高、裁到哪合适、 三分法与黄金分割在具体照片上成不成立时使用。做法是按画幅—分割—元素—关系—纵深—引导六段各给判据与一个可数的量， 收束成一句「靠什么立住」加 2–3 条按代价排序的改动。不适用于色彩关系诊断、综合打分、一组照片的顺序编排与拍摄时段的用光计划。
    tags:
    - composition
    - structure
    - framing
    - diagnosis
