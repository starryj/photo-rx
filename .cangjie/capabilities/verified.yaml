- capability_id: cap.photo-vision.frame-critique
  revision: 1
  status: active
  slug: frame-critique
  title: 单张诊断与六维打分：分数必须与诊断同源
  importance: high
  importance_rationale: 前面七张卡都能给判据，但用户最常要的是一句「这张几分、差在哪」。没有这张卡时，分数要么由单线卡顺手给（维度不一致），要么根本不给（D-02 说打分版才是正式形态）。曼特的「内容与陈述 / 组织的质量」双轴（p013）与「主导对比压过其余」的量级表述（p202）提供了可核对的两条前提；六维权重与两套口径按 D-10 定（力与光独立、中式语境单列一套），因此这张卡是把六条单线判断收进一个可比较数字的唯一落点。
  one_liner: 先定用途、介质与口径（西式／中式），跑脚本取事实并目视两条轨，定一句主导对比，再按所选口径的六维逐维给「看哪里＋分＋判据＋证据」，硬缺陷封顶 60，最后给两到三条落回维度的改动。
