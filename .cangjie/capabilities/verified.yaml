    notes: 独立意图＝「骨架成立吗」；独立契约＝六段判据＋一句主导判断＋按代价排序的改动；独立运行＝可用单张照片走完七步；复用＝同一流程用于拍前看现场与拍后诊断；评测未做（批二暂不重跑盲测，待批五统一验收）。
- capability_id: cap.photo-vision.shoot-plan
  revision: 2
  status: active
  slug: shoot-plan
  title: 光线与时段计划
  importance: high
  importance_rationale: 批二新增的光线能力，承接《光线与用光》全部可操作部分，批七补入曼特的快门前八项清单与画幅语义；它把「光不好」这种感受拆成光质、光位、时刻、曝光、色彩、配件六段可执行计划，是唯一面向「拍之前」的能力，缺它则整个包只能事后诊断。
  one_liner: 先定光质与光位，再定时段与天气，然后定曝光、色彩与配件，最后收成一张能照着执行的时段表。
