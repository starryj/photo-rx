entry:
  name: photo-rx
  description: 把十四本书蒸馏成「色彩—结构—光线—视看机制—中国观看—序列编排」六条判断线：色彩线量事实、定主导对比、判数量并按意图分岔；结构线判画幅、分割、平衡、纵深与引导；光线线定光质、光位、时段、曝光与白平衡；机制层回答「为什么会这样看」；中国观看线回答「为什么这张空／该怎么留」；序列线回答「一批怎么排、留哪些、删哪些」。曼特补进的是可数规则：点数与分割块数、八等分 3:5、面积和谐的亮度反比、组照 10–15 张的起点。批八两本只进知识层：《观看之道》补视看的语境（复制、裸像、广告），《秩序感》补预期与显著点。跨书冲突（K1 和谐、K5 规则、K6 自我表达、K7 照片能否裁决、K11
    视点、K12 虚实、K13 逼真、K14 单张与整体的尺、K15 色彩意义的层）在运行时按 branch / downgrade / qualify / split 处置，不做折中。
  core_principles:
  - 视觉里看到的色几乎从不是它物理上实际是的那色——色彩是最相对的媒介。
  - 任何色都能与任何色搭配，前提是数量合适；和谐不是唯一可欲的关系。
  - 看是建构不是接收：整体大于部分之和，第一层知觉是方向性的力。
  - 构图的两个基本原则是对比与平衡，但「功效不是规则」——规则是条件判词。
  - 光质决定阴影边缘，光位决定形状与质感，时段与天气决定可用范围。
  - 画幅先于一切，分割是比例，元素可降到点线面三级。
  - 点线面的组合是可数的：点数、分割块数、方向后果与面积占比都能当场数出来；数出来的是事实，判断仍要看意图。
  - 色彩的面积和谐可按亮度值反比估算（歌德值取反），但那是理论基准，实际以训练过的眼睛为准。
  - 视觉判断不能被照片裁决：数值以仪器为准，色相以眼睛为准，模型描述不得冒充测量。
  - 三远是三种观看方式而非三个机位；虚实相生，空要由实来显。
  - 逼真只是西方再现传统内的选择，不是评价照片的通用轴。
  - 单张有单张的尺，序列有序列的尺；序列里的弱帧可以是正确的，但它的缺陷仍要被指出。
  - 选片先定用途再定去留：删的理由只有重复、离题、技术不可用、破坏整体四类。
  - 比例按量级算，不按观感算：山大于木、木大于人，且必须大出数十百倍才显其大（郭熙「三大」）；没有共同单位时先找最小可辨识物当尺。
  - 秩序感来自预期与偏差：完全符合预期的画面没有信息，显著点是延续的中断。
  - 观看先于言语；取景是选择，复制与配文会重写影像的含义。
  - 一张照片同时问到两个域（如色彩与构图）时，先结构后色彩、合成一页回答；问到三个以上域时，先问用户最想解决哪一个，不许一口气全给。
  - 多张照片先问是不是同一组：同组再分「怎么排」（sequence-edit）与「留哪些」（cull-select）；不同组不按组照处理。
  - 同一批照片既问「留哪些」又问「怎么排」时，先 cull-select（按用途与名额删）再 sequence-edit（排列与弧），合成一页回答，不许两张卡各答一半。
  - 要分数就要判据：每一维的分数后面必须跟着一句判据和一项可复算或可指认的证据；写不出证据的维度标「未测」，不许给分。
  out_of_scope:
  - 色彩管理工程（显示器校准、ICC 特性文件、打印机配置）。
  - 器材选购、镜头评测与相机推荐。
  - 客户与市场口味判断、奖项与商业价值预测。
  - 影像的真伪鉴别（单帧取证、AI 生成判定）。
  - 编排与选片的具体操作（读卡、批量重命名、导入导出、相册同步、代删文件）。
  - 不解释「照片为什么会被这样看」的知觉机制之外的美学流派争论
  stop_conditions:
  - 用户只要一句「好看／不好看」，不接受关系分析时，停止。
  - 画面信息不足（截图过小、压缩严重、只有文字描述无图像）时，先声明色相与结构读数不可靠，只给相对结论；不得凭空填数值。
  - 用户问的是「内容好不好」，属于内容轨，本包不回答，也不许拿色彩或结构替内容辩护。
  - 需要具体软件参数（某版本滑块数值、某相机预设）时，说明这需要按用户器材确认，不虚构。
  - 用户要求出分数或报告页时，按 frame-critique 的六维量表给（西式：陈述 18／骨架 22／力 15／光 15／色 20／完成度 10；中式：陈述 12／骨架 18／势与质 20／虚实承重 25／色 15／完成度 10），分数必须与诊断同源，并声明用的是哪一套、跨套不可比（D-10）。
router_entry:
  name: photo-rx
  description: 当用户拿照片问「哪里不对／怎么改」「为什么看着不舒服」「颜色怎么调」「留白该怎么留」，或要定拍摄计划、判断一张照片成不成立、给一张照片打分与逐维判据、给一批照片排序与取舍时使用；覆盖色彩关系、构图结构、光线时段、视看机制、中国观看与序列编排六条线。也用于用户没有具体照片、只问该从哪里入手、先练什么、给自己定一套检查标准、或问某个题材该往哪个方向深挖这类学习路径与方向问题；也用于用户问某个概念或术语本身是什么意思（如「气韵生动」「三远」「虚实相生」「三大」），此时按术语表作解释，不必有照片。不适用于影像真伪鉴别、色彩管理工程、修图软件操作与纯器材评测。
promotion_budget: 9
capabilities:
- capability_id: cap.photo-vision.color-decision
  revision: 5
  status: active
  slug: color-decision
  title: 色彩关系诊断与取色决策
  importance: critical
  importance_rationale: 色彩四书（色彩圣经、Interacting with Color、Interaction of Color、曼特《摄影构图与色彩设计》）的可操作部分都由它承接；它把「色彩不对」拆成测量、数量、关系三类问题，并用主导对比与数量两维度给出可执行路径，遗漏它色彩这一路就没有可调用的产出。
  one_liner: 先量事实，再定主导对比，判数量，按意图分岔，最后只改数量与明暗、慎改色相。
  intents:
  - 诊断一张照片的色彩关系
  - 给一组配色定方向
  - 判断两色该各占多大面积
  - 统一一组照片的色彩基调
  - 决定要和谐还是要张力
  keywords:
  - 配色
  - 色彩诊断
  - 主导对比
  - 饱和度
  - 色调统一
  - color palette
  - color harmony
  - dominant contrast
  also_read:
  - structure-read
  - shoot-plan
  card: cards/color-decision.md
  frontmatter:
    description: 当用户拿一张照片或一组照片问「颜色怎么不对劲／怎么调／该往哪个方向改」，或要定一组配色、判断两色面积、 统一一组照片的色调时使用。做法是先量事实（面积、L 值、色相族）、再定主导对比、判数量，然后按「协调／张力」意图分岔， 最后给 2–4 条调整路径并写明失效条件。不适用于色彩管理工程、构图结构诊断、拍摄时段的用光计划与「好看不好看」的口味争论。
    tags:
    - color
    - diagnosis
    - decision
    - measurement
  source_evidence:
