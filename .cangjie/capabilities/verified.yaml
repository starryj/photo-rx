- capability_id: cap.photo-vision.ways-of-seeing
  revision: 2
  status: active
  slug: ways-of-seeing
  title: 视看机制：为什么会被看成这样
  importance: high
  importance_rationale: 批三新增的机制层，来自阿恩海姆与贡布里希。它不产生新配方，而是给前四张卡提供上游解释：当两条规则打架、当判断被质疑、当照片合规却不好看时，只有它能回答「为什么」。缺它则整个包只能给建议、不能自证，也无法处理「违规却站得住」这类真实情况。批八补入伯格《观看之道》，在知觉机制之外再加一层语境：复制、收藏、配文与广告都会改写影像的含义。
  one_liner: 用格式塔与再现心理学解释一张照片为什么被读成这样，并只给一条能改变力结构的动作。
  intents:
  - 解释一张照片为什么看着别扭
  - 解释明明对称为什么不稳
  - 判断两条互相矛盾的建议该听哪条的上游
  - 说明一个判断凭什么成立
  - 向别人讲清原理而不是替别人做决定
  keywords:
  - 为什么
  - 原理
  - 机制
  - 格式塔
  - 张力
  - 视觉重量
  - 错觉
  - 图式
  - why
  - mechanism
  - gestalt
  - tension
  - illusion
  - schema
  card: cards/ways-of-seeing.md
  also_read:
  - structure-read
  - color-decision
  source_evidence:
