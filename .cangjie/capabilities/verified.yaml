  - 计划一次拍摄的时段与用光
  - 判断阴天正午逆光各自能拍什么
  - 决定用什么光质与光位拍出某种质感
  - 决定白平衡该校正还是刻意偏移
  - 决定要不要偏振镜、渐变镜、反光板或闪光
