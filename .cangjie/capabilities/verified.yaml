- capability_id: cap.photo-vision.chinese-eye
  revision: 1
  status: active
  slug: chinese-eye
  title: 中国观看体系：三远、留白与多角度观照
  importance: high
  importance_rationale: 前八本书全部是西方的（色彩学、再现心理学、格式塔、器材实操），包在「空、散、气、意境」这类问法上完全无语料。批四补上的正是另一套空间观：三远、虚实相生、多角度观照。它不替代 structure-read，而是在用户问「为什么这张空」时给出结构派给不出的答案，并与 K11/K12 两条对抗绑定。 batch 6 把郭熙《林泉高致》收进来之后，三远、三大、远近分工、景外意都改由第一手支撑；此前全靠宗白华与叶朗的转引，且两处措辞与原文有差（「冲融而缥缈」「矫侈之目」），已按原文改正。
  one_liner: 先定这套画面走哪一套空间，再选一远、查远近分工、验虚实承重、找气眼，最后只给换机位与加减虚实两条动作。
