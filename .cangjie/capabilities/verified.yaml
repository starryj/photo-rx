    description: 当用户手里有一批照片要排成组照、画册、网页或配乐短片，问「怎么排／顺序有没有讲究／放在一起为什么散」，或要给一部作品定整体色调走向时使用。做法是先定用途与读者，把每张压成只看色与明暗的三格数据，读出当前弧的升/降/平，定一对贯穿的对抗关系，再做减法与位移，最后交出一句弧的描述加至多三条动作。只管顺序、段落与整体色调走向；不管排版制作（画册开本、出血、软件里的页序）、起标题写说明与具体配乐或剪辑时间码——那几类是制作与文案，不是编排判断。也不适用于单张诊断与打分（用
