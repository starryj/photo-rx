    quote: 这两种性质就是重力和方向。
  - book: arnheim-art
    id: ar22
    page: p035
    quote: 也就是说，对于一件平衡的构图来说，其形状、方向、位置诸要素之间的关系，都达到了如此确定的程度，以至于不允许这些要素有任何些微的改变。
  - book: arnheim-art
    id: ar23
    page: p032
    quote: 原因在于：诸如大小、色彩、方向等因素造成的视觉平衡值，往往与相对应的物理因素不一致。
- id: C118
  claim: 中心之所以稳定是因为各方向的力在这一点互相抵消，不是因为那里空；下方比上方稳定，上方位置天然不稳，需要更多支撑理由。
