- id: fl28
  claim: 质感靠形状之外的微观阴影显现，只有小角度的强烈侧光才能在表面投出这些阴影。
  page: p142
  quote: "明暗对比法通过明暗渐变来做到这一点，它能够很好地表现形状和体态，但质感却比形状精细得多，只有用小角度的强烈侧光照射到物体表面上，才能投射出无数微观尺度的小阴影，从而表现出质感。"
  stance: 技术派
  domain: 光与时段
  operational: principle
  single_source: true

- id: fl30
  claim: 包围光在大自然中很少见，所以眼睛会认为它很奇特——这是它不适合写实人像的知觉原因。
  page: p125
  quote: "你要记住，包围光在大自然中是很少见的，你的眼睛会认为这是很奇特的东西。"
  stance: 技术派
  domain: 光与时段
  operational: principle
  single_source: true

- id: fl32
  claim: 理想的白平衡是按你的感官完美、精确地再现场景——这是校正派的基准定义。
  page: p027
  quote: "理想的白平衡应该按照你的感官完美、精确地再现场景。"
  stance: 技术派
