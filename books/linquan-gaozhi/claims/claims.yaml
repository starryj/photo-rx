- id: lq01
  page: p023
  type: framework
  claim: 山水画的本意＝替代性满足：让观者「不下堂筵，坐穷泉壑」，在画中重获林泉之志
  source_chapter: 山水训
  quote: 然则林泉之志、烟霞之侣，梦寐在焉，耳目断绝。今得妙手，郁然出之，不下堂筵，坐穷泉壑
  domain: 情绪与象征
- id: lq02
  page: p027
  type: principle
  claim: 画的尺度要「不小气也不遗憾」：铺开成巨幅不显赘余，收成小景也不觉缺失
  source_chapter: 山水训
  quote: 铺舒为宏图而无余；消缩为小景而不少。
  domain: 构图与结构
- id: lq03
  page: p027
  type: framework
  claim: 看山水亦有法则——以林泉之心看，价高；以矫侈之目看，价低。观看姿态本身决定看到什么
  source_chapter: 山水训
  quote: 看山水亦有体：以林泉之心临之
  domain: 语境与相对性
- id: lq04
  page: p047
  type: framework
  claim: 「身即山川而取之」：必须进入景物所在的位置与距离，山水的意态才显现
  source_chapter: 山水训
  quote: 盖身即山川而取之，则山水之意度见矣
  domain: 方法论
- id: lq05
  page: p047
  type: principle
  claim: 学画花要挖深坑自上俯瞰，学画竹要借月影看墙上的影——换位置、去掉实体只留影形
  source_chapter: 山水训
  quote: 学画花者，以一株花置深坑中，临其上而瞰之
  domain: 方法论
- id: lq06
  page: p047
  type: principle
  claim: 远近分工：川谷远望取纵深、近游取亲近；岩石远望取其势、近看取其质
  source_chapter: 山水训
  quote: 真山水之川谷，远望之以取其深，近游之以取其浅；真山水之岩石，远望之以取其势，近看之以取其质
  domain: 空间
- id: lq07
  page: p050
  type: principle
  claim: 云气要「见其大象而不为斩刻之形」，态度才活——抓总体气象，不做雕琢刻板的形状
  source_chapter: 山水训
  quote: 画见其大象，而不为斩刻之形，则云气之态度活矣。
  domain: 光与时段
- id: lq08
  page: p050
  type: framework
  claim: 四时烟岚的表情：春山澹冶而如笑、夏苍翠而如滴、秋明净而如妆、冬惨淡而如睡
  source_chapter: 山水训
  quote: 春山澹冶而如笑，夏山苍翠而如滴，秋山明净而如妆，冬山惨淡而如睡。
  domain: 光与时段
- id: lq09
  page: p050
  type: principle
  claim: 烟岚同理：见其大意而不为刻画之迹，景象才正
  source_chapter: 山水训
  quote: 画见其大意，而不为刻画之迹，则烟岚之景象正矣。
  domain: 光与时段
- id: lq10
  page: p050
  type: principle
  claim: 有些现象只能远望：风雨的近况、一路小径的起止之势，凑近反而看不出来
  source_chapter: 山水训
  quote: 真山水之风雨，远望可得，而近者玩习不能究一川径隧起止之势
  domain: 空间
- id: lq11
  page: p050
  type: framework
  claim: 每个元素都承担一件判读任务：人物标道路、楼观标胜概、林木映蔽分远近、溪谷继续分深浅
  source_chapter: 山水训
  quote: 山之人物，以标道路；山之楼观，以标胜概；山之林木映蔽，以分远近；山之溪谷继续，以分深浅
  domain: 构图与结构
- id: lq12
  page: p054
  type: framework
  claim: 「景外意」：让观者觉得「如真在此山中」，是画外之意的第一层
  source_chapter: 山水训
  quote: 看此画，令人生此意，如真在此山中，此画之景外意也。
  domain: 情绪与象征
- id: lq13
  page: p054
  type: framework
  claim: 「意外妙」：见青烟白道思行、见平川落照思望、见幽人山客思居、见岩扃泉石思游——把观者推入「将真即其处」的行动想象
  source_chapter: 山水训
  quote: 见青烟白道而思行，见平川落照而思望，见幽人山客而思居，见岩扃泉石而思游
  domain: 情绪与象征
- id: lq14
  page: p063
  type: framework
  claim: 「饱游饫看」：看得足够多、多到罗列胸中，落笔时才会「目不见绢素，手不知笔墨」
  source_chapter: 山水训
  quote: 欲夺其造化，则莫神于好，莫精于勤，莫大于饱游饫看，历历罗列于胸中，而目不见绢素，手不知笔墨
  domain: 方法论
- id: lq15
  page: p063
  type: framework
  claim: 画不好的四个病根：所养不扩充、所览不淳熟、所经不众多、所求不精粹
  source_chapter: 山水训
  quote: 今执笔者所养之不扩充，所览之不淳熟，所经之不众多，所求之不精粹
  domain: 方法论
- id: lq16
  page: p079
  type: framework
  claim: 石为天地之骨（贵坚深而不浅露），水为天地之血（贵周流而不凝滞）——用身体作画法判据
  source_chapter: 山水训
  quote: 石者，天地之骨也，骨贵坚深而不浅露；水者，天地之血也，血贵周流而不凝滞。
  domain: 构图与结构
- id: lq17
  page: p079
  type: principle
  claim: 山与水互相成全：山得水而活，水得山而媚
  source_chapter: 山水训
  quote: 山得水而活，水得山而媚。
  domain: 构图与结构
- id: lq18
  page: p079
  type: principle
  claim: 山无烟云，如春无花草——缺了过渡物，主体就失去生气
  source_chapter: 山水训
  quote: 山无烟云，如春无花草。
  domain: 光与时段
- id: lq19
  page: p081
  type: framework
  claim: 三远的本义是三种取景方向：仰山颠为高远、窥山后为深远、望远山为平远
  source_chapter: 山水训
  quote: 山有三远：自山下而仰山颠，谓之高远；自山前而窥山后，谓之深远；自近山而望远山，谓之平远。
  domain: 空间
- id: lq20
  page: p081
  type: principle
  claim: 三远各有其「势」与「意」：高远突兀、深远重叠、平远冲融而缥缈
  source_chapter: 山水训
  quote: 高远之势突兀，深远之意重叠，平远之意冲融而缥缈
  domain: 空间
- id: lq21
  page: p081
  type: principle
  claim: 三远各自配套人物尺度：明了者不短、细碎者不长、冲澹者不大
  source_chapter: 山水训
  quote: 明了者不短，细碎者不长，冲澹者不大。此三远也。
  domain: 数量与面积
- id: lq22
  page: p081
  type: principle
  claim: 「三大」：山大于木、木大于人；山不比木大数十百倍就不显其大，木不比人大数十百倍就不显其大
  source_chapter: 山水训
  quote: 山有三大：山大于木，木大于人。山不数十百如木之大，则山不大；木不数十百如人之大，则木不大
  domain: 数量与面积
- id: lq23
  page: p082
  type: principle
  claim: 三大的落地做法＝以叶为共同单位换算：木叶若干可敌一人之头，据此推人、木、山的大小
  source_chapter: 山水训
  quote: 此而皆中程度。此三大也。
  domain: 数量与面积
- id: lq24
  page: p087
  type: principle
  claim: 「远山无皴，远水无波，远人无目。非无也，如无尔」——远景不是没有细节，是看起来像没有
  source_chapter: 山水训
  quote: 远水无波，远人无目。非无也，如无尔。
  domain: 空间
- id: lq25
  page: p108
  type: principle
  claim: 地貌决定林木形态：土山戴石则林瘦耸，石山戴土则林肥茂；土厚处有千尺之松，土薄处只有数尺之蘖
  source_chapter: 画诀
  quote: 山有戴石。土山戴石，林木瘦耸；石山戴土，林木肥茂。
  domain: 构图与结构
- id: lq26
  page: p084
  type: framework
  claim: 「以大观小」主张：画山当如人观假山，自下望上只合见一重山，看不到重重与溪谷庭巷
  source_chapter: 沈括《梦溪笔谈》评李成（杨伯引述）
  quote: 若同真山之法，以下望上，只合见一重山，岂可重重奚见？
  domain: 空间
  note: 非郭熙本文，出自沈括评李成语；此前包内把它当作郭熙原话，此处更正
- id: lq27
  page: p191
  type: framework
  claim: 传世口诀：「凡画山水，意在笔先。丈山尺树，寸马豆人」；远人无目、远树无枝、远山无石、远水无波
  source_chapter: 附录二《山水赋》（旧题荆浩，与传为王维《山水论》文字基本相同）
  quote: 凡画山水，意在笔先。丈山尺树，寸马豆人。此其格也。
  domain: 数量与面积
  note: 非郭熙本文，为唐宋画工相传口诀，收作附录
