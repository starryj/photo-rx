# 色彩圣经 · claims（阶段 1 独立抽取，不参照另两本）
# stance 一律：规则派（有对的做法，并且愿意写下来）
# operational：可操作 = 能进 E 段步骤；描述性 = 只能进 I 段；经验断言 = 只能进 B 段
# page / quote 全部经 tools/check_claims.py 机械核对（OCR 书，标 verified_against_scan）

- id: cb01
  claim: 拍摄与修图在透射光 RGB 域，打印才进入颜料与反射光域；三套系统互不等价
  page: p020
  quote: "我们使用透射光（红/绿/蓝）色彩模型，用于拍摄和编辑照片，当需要打印我们的照片时，由于在纸张上的墨和色彩就是反射色彩源的实例，我们就进入了颜料和反射光的领域。"
  stance: 规则派
  domain: 色相
  operational: 可操作
  single_source: true

- id: cb02
  claim: 加色法原色靠相互叠加而非减去色彩来创造新色，故与颜料的减法原色不同
  page: p026
  quote: "这些颜色的名字是加色法原色，因为它们实际上创造新色彩的方式，是相互叠加，而非减去色彩。"
  stance: 规则派
  domain: 色相
  operational: 描述性
  single_source: true

- id: cb03
  claim: 色彩三属性为色相、饱和度（纯度）与亮度，三者可分别描述与调节
  page: p078
  quote: "色彩具有三种性质:色相（也就是大多数人认为的物体的色彩)，饱和度(色彩的纯度)以及亮度。"
  stance: 规则派
  domain: 色彩属性
  operational: 可操作
  single_source: true

- id: cb04
  claim: 视锥细胞约 600–700 万个且对色敏感，视杆细胞负责暗光辨形但不分色
  page: p033
  quote: "我们每只眼睛中大约有六百至七百万个对色彩敏感的视锥细胞。"
  stance: 规则派
  domain: 机制
  operational: 描述性
  single_source: true
  note: 视杆数量原文作 1.5 亿（p032），与常见生理学数据（约 1.2 亿）有出入，只作书的表述记录

- id: cb05
  claim: 传感器每像素只覆盖一种色彩滤镜，靠反马赛克处理用邻域解析出另两色
  page: p037
  quote: "这个传感器上的每一个像素都只覆盖一种色彩的滤镜，然后相机通过一种被称为反马赛克的处理来解析色彩。"
  stance: 规则派
  domain: 机制
  operational: 描述性
  single_source: true

- id: cb06
  claim: 冷色在构图中后退、暖色前进，这是心理与视觉双重效果
  page: p043
  quote: '不论是从心理的角度，还是从视觉的角度，冷色调在构图中都会有一种让人感觉“后退”的效果，而非暖色调一样有更靠近观众的感觉。'
  stance: 规则派
  domain: 冷暖
  operational: 可操作
  single_source: true

- id: cb07
  claim: 效果最强的对比不是「互补」本身，而是参与各色从强度到亮度都相等的时候
  page: p046
  quote: "因为色彩对比的想法是让两种或者多种色彩相互对比，那效果最强的对比，就是这些色彩从强度到亮度都相等的时候。"
  stance: 规则派
  domain: 对比
  operational: 可操作
  single_source: true

- id: cb08
  claim: 简化色彩范围后构图更有戏剧性，原因是色彩之间的对比更明显
  page: p046
  quote: "而另一种情况下，虽然我们可以同时使用多种明亮的色彩，通过色彩对比来创造风格强烈的设计效果，但是当我们对色彩的范围进行简化以后，这种构图反而会更加具有戏剧性，原因就是色彩之间的对比会更加明显。"
  stance: 规则派
  domain: 对比
  operational: 可操作
  single_source: true

- id: cb09
