- id: go01
  claim: 再现从来不是复制眼前所见，而是「图式 + 矫正」：先有一套现成公式，再拿它去对自然做试错修正。
  page: p006
  quote: 正是着眼于此，我才在书中讲“图式和矫正”的过程—矫正这个词蕴涵着更为接近真实的意见，至少是消除虚伪性。
  stance: mechanism
  domain: 机制
  operational: principle
  single_source: true
- id: go02
  claim: 制作先于匹配——先做出一个形，再去检验它像不像；「像不像」永远发生在「做出来之后」，这是再现的因果方向。
  page: p124
  quote: 如果我一定要将上一章概括为一个简短的公式，那就是“先制作后匹配”
  stance: mechanism
  domain: 机制
  operational: principle
  single_source: true
- id: go03
  claim: 图像只有在观者肯承担「观看者的本分」时才成立——画面的完成有一半在观看者身上。
  page: p180
  quote: 我摘引这样长的一段文字，是因为它概括了我们现在转而讨论的问题—在理解艺术家描绘的图像方面，我们亦即观看者的本分。
  stance: mechanism
  domain: 语境与相对性
  operational: principle
  single_source: true
- id: go04
  claim: 知觉是有选择的注意，心理学叫心理定向；看与看见、听与听见的差别就来自这层过滤，没有它人会被刺激淹没。
  page: p018
  quote: 心理学用心理定向[mentalset]这一术语描述这种知觉调整的形式，一种有选择性的注意的形式，这种形式被描述为日常用语中观看与看见、倾听与听见之间的差别。
  stance: mechanism
  domain: 机制
  operational: principle
  single_source: true
- id: go05
  claim: 错觉的本质是相信眼前的视觉模式只有一种解释方法——不是看错，而是排他。
  page: p235
  quote: 我认为错觉在于认为我们面前的视觉模式只有一种解释方法这样一种信念。
  stance: mechanism
  domain: 语境与相对性
  operational: principle
  single_source: true
- id: go06
  claim: 错觉必须与错误信念区分开：知道娃娃不是婴儿的人照样能被舞台上的一切打动，这两件事不能互相解释。
  page: p017
  quote: 在我看来它是一个重要的提醒物，提醒我们这样的事实，必须把错觉与错误信念相区别；
  stance: mechanism
  domain: 语境与相对性
  operational: principle
  single_source: true
- id: go07
  claim: 符号靠区别性特征表达意义，其余一概不相干——照片被读成某物，靠的也是少数区别性特征而非全部细节。
  page: p020
  quote: 它们依赖于这种区别性特征，其余则不相干，这是一般符号的特征。
  stance: mechanism
  domain: 机制
  operational: principle
  single_source: true
- id: go08
  claim: 「透视法只是一种程式」这个信念，来自把关系模型误当成图像本身。
  page: p239
  quote: 透视法立足于程式这种信念，是由于混淆了关系模型跟图像而产生的。
  stance: mechanism
  domain: 空间
  operational: principle
  single_source: true
- id: go09
  claim: 知觉本质上可看作对预期进行的一次矫正——先有预判，再看实际，差异驱动知觉修正。
  page: p172
  quote: 最近，有人说：“知觉本质上可以被看做是对一个预期进行的矫正。
  stance: mechanism
  domain: 机制
  operational: principle
  single_source: true
- id: go10
  claim: 我们能学习的不是「观看」而是「辨别」——把训练说成「学会看」会掩盖真正发生的事。
  page: p172
  quote: 我们对于训练眼睛或学习观看的话颇有所闻，但是如果它掩盖了我们能够学习的不是观看而是辨别这个事实的话，这种措辞能把人引入歧途。
  stance: mechanism
  domain: 方法论
  operational: principle
  single_source: true
- id: go11
  claim: 投射：人会把熟悉的面目形状加到一个陌生形状上（云朵、汽车前脸），这是识别而非比较。
  page: p114
  quote: 我们说，我们把一个熟悉的面目形状“投射”到了一辆汽车的形状上，就像我们把熟悉的图像投射到与云朵相似的形状上一样。
  stance: mechanism
  domain: 机制
  operational: principle
  single_source: true
- id: go12
  claim: 一切再现风格都靠图式运行；一个时期风格彼此相似，是因为描绘视觉真实必须先学的那些公式相同。
  page: p005
  quote: 然而本书实际所论却是：种种再现风格一律凭图式以行，各个时期的绘画风格的相对一致是由于描绘视觉真实不能不学习的公式。
  stance: mechanism
  domain: 机制
  operational: principle
  single_source: true
- id: go13
  claim: 他不接受「根本没有视觉现实、任何再现都无从比较谁更逼真」这一相对主义立场——这是本书对极端建构论的正面反对。
  page: p006
  quote: 我更难以接受的观点是不承认有视觉现实其物，从而竟认为我们对任何再现之作都没有理由说它是否比别的作品更为逼真。
  stance: mechanism
  domain: 语境与相对性
  operational: principle
  single_source: true
- id: go14
  claim: 只把「观看 vs 知道」或「一切再现都基于程式」重复一遍，解决不了问题——程式论是一半，不是全部。
  page: p046
  quote: 或者泛泛地强调一切再现都基于程式，并不足以解决我们这个学科的这些中心问题。
  stance: mechanism
  domain: 方法论
  operational: principle
  single_source: true
- id: go15
  claim: 有生命的错觉不需要关于现实的错觉；它靠两件事成立——世代累积的图画效果经验，与制作者对特定效果的反复试验。
  page: p308
  quote: 这项成就不需要任何关于现实的错觉就能制造出有生命的错觉，我认为它的成功有两个条件：一个条件是一代代艺术家对图画效果的经验；
  stance: mechanism
  domain: 机制
  operational: principle
  single_source: true
- id: go16
  claim: 中国传统不以求逼真为目标，因为书法与绘画休戚相关，绘画风格不允许独以惟妙惟肖为务——逼真不是普遍标准。
  page: p005
  quote: 由于中国的书法和绘画息息相关，恐怕已不容绘画风格独树一帜，专以惟妙惟肖地重现现实为务。
  stance: mechanism
  domain: 语境与相对性
  operational: principle
  single_source: true
- id: go17
  claim: 学「看」很大程度上是学「预测序列」——比如头部移动时一件物体投到视网膜上的形状次序，而不是学一次性的影像。
  page: p257
  quote: 学习“观看”可能极大地关系到学会预测序列的次序——我们头部移动时，一把椅子或一张桌子投射到我们视网膜上的形状的先后次序。
  stance: mechanism
  domain: 方法论
  operational: principle
  single_source: true
- id: go18
  claim: 看过舍费尔对埃及程式的分析后，人会更常想到程式化的再现法，而更少想到儿童艺术——先例塑造眼睛。
  page: p128
  quote: 如果一个人看过舍费尔对埃及程式的分析，那他便会经常想起这样一些程式化的再现法，而较少想到儿童艺术。
  stance: mechanism
  domain: 方法论
  operational: principle
  single_source: true
- id: go19
  claim: 一个公式如果只能「不断修正以求与现象一致」，那种表面长处正是它致命的缺陷——托勒密体系是例子。
  page: p256
  quote: 托勒密关于天体远行周期和本轮的复杂系统永远可以进行修正，以“求得与现象一致”，但是它表面上的长处实际上却是它致命的缺陷。
  stance: mechanism
  domain: 方法论
  operational: principle
  single_source: true
- id: go20
  claim: 观众信不信服会反过来驱动作者修正公式，并让画更接近一个说得通的叙事——观看者的反馈是再现推进的机制之一。
  page: p135
  quote: 我们不知道他的观众是否感到他的变体画法十分令人信服，但是，如果不能令人信服，那就会有充分的刺激，鼓励他再次尝试，修正那种公式，并使他的画更接近一种合乎情理的叙事。
  stance: mechanism
  domain: 语境与相对性
  operational: principle
  single_source: true
- id: go21
  claim: 在知觉中，检验解释时下一步几乎是可以预期到的——这就把「预期—修正」从比喻变成可操作的知觉模型。
  page: p280
  quote: 换句话说，在知觉这个过程中，在我们检验我们的解释时将出现的东西，它的下一个阶段几乎是可以预期到的。
  stance: mechanism
  domain: 机制
  operational: principle
  single_source: true
- id: go22
  claim: 「透视不过是一种程式」这种观念有其潜在根基，但它并不是对透视法的最终判断。
  page: p240
  quote: 认为透视法不过是一种程式，并不是按照世界的外观去再现世界，这种观念潜在的根基或许就在这里。
  stance: mechanism
  domain: 空间
  operational: principle
  single_source: true
- id: go23
  claim: 在生活情境里观察世界与读解绘画，这两件事是否可比，是他反复追问的关口——他并不认为二者自动同一。
  page: p257
  quote: 但是，即使承认我们的预测和预期在知觉中所起的作用—这种作用已使一位心理学者论及运动和知觉二者的统一—这种眼光难道不妨碍对读解绘画和在生活情境中观察世界这二者进行什么比较吗？
  stance: mechanism
  domain: 语境与相对性
  operational: principle
  single_source: true
- id: go24
  claim: 他愿意用「试错过程」取代「解释」一词，只要描述的还是同一件事：靠试错清除错觉、检验与修改我们对世界的信念。
  page: p011
  quote: 我愿意用另一个名词来代替那令人不快的“解释”[interpretation]一词，只要它描述的还是同一个试错过程，还是我们只凭它—在知觉方面跟在科学方面一样——去清除种种错觉，检验和修改我们对世界、对信念的那个试错过程。
  stance: mechanism
  domain: 方法论
  operational: principle
  single_source: true
- id: go25
  claim: 行动的上下文会创造错觉条件——同一块色、同一个形，在「正在发生什么」里被读成不同的东西。
  page: p197
  quote: 在研究视觉图像的人看来，这些经验是颇有关系的，因为它们说明了行动的上下文[contextofaction]是怎样创造错觉条件的。
  stance: mechanism
  domain: 语境与相对性
  operational: principle
  single_source: true
