- id: ca01
  page: p287
  type: framework
  claim: 郭熙的「三远」之说，对山水画的意境作了概括（叶朗自己对三远地位的判断）
  source_chapter: p287
  quote: 郭熙的“三远”之说，对山水画的意境作了概括
  domain: 空间
- id: ca02
  page: p291
  type: framework
  claim: 山形步步移：同一座山，近看、远数里看、远十数里看都不同，所以观照必须多角度
  source_chapter: p291
  quote: 山，近看如此，远数里看又如此，远十数里看又如此，每远每异，所谓山形步步移也
  domain: 方法论
- id: ca03
  page: p291
  type: principle
  claim: 山形面面看：正面、侧面、背面各不相同，一山而兼数十百山之形状
  source_chapter: p291
  quote: 山，正面如此，侧面又如此，背面又如此，每看每异，所谓山形面面看也
  domain: 方法论
- id: ca04
  page: p290
  type: principle
  claim: 远望取势、近看取质——远与近各有专责，不是同一种看的强弱版
  source_chapter: p290
  quote: 真山水之川谷，远望之以取其势，近看之以取其质
  domain: 方法论
- id: ca05
  page: p291
  type: principle
  claim: 郭熙最看重远望：近看只能把握特点，远望才能把握气势，才能造出三远的意境
  source_chapter: p291
  quote: 近看可以把握山水的特点，只有远望才可以把握山水的气势
  domain: 方法论
- id: ca06
  page: p288
  type: framework
  claim: 「身即山川而取之」：必须对自然作直接观照，山水之意度才会显现
  source_chapter: p288
  quote: 盖身即山川而取之，则山水之意度见矣
  domain: 方法论
- id: ca07
  page: p288
  type: principle
  claim: 「林泉之心」：面对山水要有审美的心胸，否则即便直接面对也发现不了审美价值
  source_chapter: p288
  quote: 看山水亦有体。以林泉之心临之则价高，以骄侈之目临之则价低
  domain: 方法论
- id: ca08
  page: p291
  type: procedure
  claim: 「饱游饫看」：观照要有广度与深度，是提炼概括的前提
  source_chapter: p291
  quote: 莫大于饱游饫看
  domain: 方法论
- id: ca09
  page: p290
  type: principle
  claim: 云气四时不同：春融怡、夏蓊郁、秋疏薄、冬黯淡
  source_chapter: p290
  quote: 真山水之云气，四时不同：春融怡，夏蓊郁，秋疏薄，冬黯淡
  domain: 光与时段
- id: ca10
  page: p290
  type: principle
  claim: 烟岚四时不同，且各有拟人化的情态
  source_chapter: p290
  quote: 春山淡冶而如笑，夏山苍翠而如滴，秋山明净而如妆，冬山惨淡而如睡
  domain: 光与时段
- id: ca11
  page: p293
  type: principle
  claim: 意象要「浑然相应」：高下大小向背颠顶朝揖必须成为一个整体，山之美才足
  source_chapter: p293
  quote: 其体浑然相应，则山之美意足矣
  domain: 构图与结构
- id: ca12
  page: p293
  type: principle
  claim: 「景外意」与「意外妙」：画要能让人起「如真在此山中」之意与「如将真即其处」之心
  source_chapter: p293
  quote: 看此画令人生此意，如真在此山中，此画之景外意也
  domain: 构图与结构
- id: ca13
  page: p298
  type: framework
  claim: 三远的完整表述：高远之色清明、深远之色重晦、平远之色有明有晦
  source_chapter: p298
  quote: 高远之色清明，深远之色重晦，平远之色有明有晦
  domain: 空间
- id: ca14
  page: p298
  type: framework
  claim: 三远的势：高远之势突兀，深远之意重叠，平远之意冲融而缥缥缈缈
  source_chapter: p298
  quote: 高远之势突兀，深远之色重叠，平远之意冲融而缥缥缈缈。
  domain: 空间
- id: ca15
  page: p298
  type: principle
  claim: 三远中人物的处理也分三种：高远者明了，深远者细碎，平远者冲澹
  source_chapter: p298
  quote: 其人物之在三远也，高远者明了，深远者细碎，平远者冲澹
  domain: 空间
- id: ca16
  page: p287
  type: principle
  claim: 「逸品」反映画家从重再现转向重表现，把山水作为抒发主观情趣的手段
  source_chapter: p287
  quote: 反映了一部分画家从重“再现”转向重“表现”
  domain: 情绪与象征
