- id: m01
  page: p013
  type: framework
  claim: 评价照片有两条互不替代的轴：内容与陈述（信息、情感反应），以及组织质量（结构与色彩设计）。
  source_chapter: p013 + 没有设计的照片是不完美的
  quote: '"评价照片好坏的标准有二：一是“内容和陈述”，涉及到照片中包含的理性认识和情感反应；二是“组织的质量”，涉及到画面的结构和色彩设计。"'
  domain: 方法论
- id: m02
  page: p022
  type: principle
  claim: 正方形中心点只有两种距离张力（到边、到角），长方形有三种；距离种类越少且差值越大，中心越不稳，稍作偏移或用长方形制衡可恢复稳定。
  source_chapter: p022 + 画面中点的位置
  quote: '"经过精确估算，处于正方形正中心的点只有两种距离的视觉张力：一是与四个角的距离，二是与四条边（上、下、左、右）的距离。"'
  domain: 构图与结构
- id: m03
  page: p023
  type: principle
  claim: 一个形状要成为构图意义上的「点」，其面积相对画面必须非常小；面积一大就已成面或形，点的位置张力不再适用。
  source_chapter: p023 + 点的尺寸和形状
  quote: '"不管是什么，作为一个名副其实的点，点的区域面积与整个画面相比，必须“非常”小（如图G、H）。"'
  domain: 构图与结构
- id: m04
  page: p024
  type: principle
  claim: 亮、暗或高饱和的小点算强调还是干扰没有硬判据；可操作的替代判据是拿掉它之后主题是否更纯粹。
  source_chapter: p024 + 显著点、干扰点
  quote: '"虽然这样的点很醒目，但在画面构图中它到底是起强调作用还是起干扰作用要分情况而论，并且往往很难界定，因为每个观者的主观判断是不同的。"'
  domain: 方法论
- id: m05
  page: p028
  type: principle
  claim: 两个点放在虚拟对角线上会与相对的角形成较强张力；贴近水平或垂直边时则像被边吸附，干扰视线。
  source_chapter: p028 + 两到三个点
  quote: '"两个放置在虚拟对角线上的点与相对的角产生较强的视觉张力（如图 B）。"'
  domain: 构图与结构
- id: m06
  page: p029
  type: principle
  claim: 第三个点放在两点之间，视线会把三点读成一条穿过它们的线；偏移过大则线感消失、平衡被打破。
  source_chapter: p029 + 画面中的三个点
  quote: '"把两个点之外的第三个点放置在两点的中间位置是最自然、最中立的效果（如图 D）。"'
  domain: 构图与结构
- id: m07
  page: p029
  type: principle
  claim: 三点成三角时，若有边与画框平行，方向指引与运动暗示最强；三边都不平行则呈流动性、无明确方向。
  source_chapter: p029 + 画面中的三个点
  quote: 如果三角形的某条边与照片的边平行，此时所带来的方向指引、运动暗示感是最强烈的(如图G、H)。如果没有一条边与照片的边平行，那么形成的三角形便呈现出一定的“流动性”(如图1)，即没有指示明确的方向。
  domain: 构图与结构
- id: m08
  page: p035
  type: principle
  claim: 视觉系统按最省力原则补线：两点之间补直线，散点补成最简单的图形；暗示线因此几乎总是直线。
  source_chapter: p035 + 简化原则
  quote: '"肉眼根据简化原则将点连接在一起——在点与点之间寻找最短距离——即一条直线。因此，暗示线往往是一条直线。"'
  domain: 机制
- id: m09
  page: p041
  type: principle
  claim: 重复的间距结构决定动静：等距同质最静，两两成组张力增强，不规则交替产生强动势；变化越多动感越强。
  source_chapter: p041 + 重复和节奏
  quote: '"产生视觉节奏最简单的结构是“一加一加一”的模式——即相同形状、同等尺寸的元素以同等间距简单重复排列（如图G）。"'
  domain: 构图与结构
- id: m10
  page: p055
  type: principle
  claim: 把画幅长或宽对折三次得到八等分，取 3:5 处即可快速定位黄金分割点。
  source_chapter: p055 + 协调和张力
  quote: 要找到黄金分割点并不难，将一张纸对折三次，将它的长或宽分成八等分(如图H和1)，便可找到3:5的比例。
  domain: 构图与结构
- id: m11
  page: p057
  type: principle
  claim: 水平线放在画面正中会把画面切成等份、缺乏张力；放在中间上下一个八分单元处较和谐，贴近边缘则张力最强。
  source_chapter: p057 + 协调和张力
  quote: 将平面八等分的同时标示了画面的中间位置—应避免在此处放置水平线。具有和谐张力的分割点应在中间位置上下一个单元处(如图H、1)。
  domain: 构图与结构
- id: m12
  page: p065
  type: principle
  claim: 下降对角线自带滑出画面的趋势，竖幅与陡角度会放大它；在右下放垂直物体作阻塞可把视线留在画面内。
  source_chapter: p065 + 平面分割和对角线的运动
  quote: '"在竖向格式的照片中，下降对角线的“滑落效果”得以放大。这时候必须用垂直物体去限制观者的视线，以免他们的注意力从右下角转移出画面。"'
  domain: 构图与结构
- id: m13
  page: p075
  type: principle
  claim: 一组线里主线条必须最粗；连贯且通常最长的线会被读成最重要的线，其余线需明显退为附属。
  source_chapter: p075 + 线条和线条分支
  quote: '"相对于附属线条来说，主线条必须是最粗的线条（如照片2、5、9、17）。在观者看来，连贯线条——通常也是最长的线条——一般是画面中最主要、最重要的线条（如照片21）。"'
  domain: 构图与结构
- id: m14
  page: p102
  type: principle
  claim: 正负形可按由外到内或由内到外逐层分析；同一面在不同层级上正负身份不同，主观照片不必做全层分析。
  source_chapter: p102 + 正形与负形优先级的改变
  quote: '"当我们需要分析一个作品中的正负形时，我们可以由外到内或者由内到外逐步分析画面。"'
  domain: 构图与结构
- id: m15
  page: p102
  type: principle
  claim: 形状重叠时，可见、在前的为正形，被遮挡、在后的为负形；背景相对所有形状都是负形。
  source_chapter: p102 + 正形与负形优先级的改变
  quote: 如果两个形状已经发生重叠，那么在后面的可见形状或物体就成了负形，而在前面的形状就成了正形。
  domain: 构图与结构
- id: m16
  page: p103
  type: principle
  claim: 带缺口的暗形状（门、窗、洞口）构成「框中框」，能把视线限制在框内并迅速吸过去；框架需三到四个角。
  source_chapter: p103 + 图形和背景：正形和负形
  quote: '"透过一个缺口（中空形）观察的视觉效果（即前文所述的“框架中的框架”）可以通过暗形状框架的三到四个角来实现。"'
  domain: 空间
- id: m17
  page: p104
  type: principle
  claim: 黑白摄影里色调是唯一可行的设计手段；色彩对比与纯度对比全部失效，明暗层级不够就撑不起画面。
  source_chapter: p104 + 黑白照片中的色调对比
  quote: '"在黑白摄影中，色调是刺激观者视觉感受惟一可行的设计方法。"'
  domain: 明度
- id: m18
  page: p107
  type: principle
  claim: 直射光、背景光和刺眼日光能支撑强色调对比；柔和迂回的光会降低色调对比与颜色强度，后期加对比不能替代光质。
  source_chapter: p107 + 光线和照明
  quote: '"刺眼的日光、直射光源和背景光可以支撑强烈的色调对比（如照片4、6、9、10、13、19），而柔和的、迂回的光线则能降低色调对比和颜色的强度（照片14、15、16、20）。"'
  domain: 光与时段
- id: m19
  page: p107
  type: principle
  claim: 暗背景里的亮点会被串成一条穿过画面的「光通道」，视线逐点跳跃；应先排亮点顺序（入口—中继—终点）再检查是否指向主体。
  source_chapter: p107 + 照片中的色调分布
  quote: '"而分布在较暗或者非常暗的背景中的亮点则会引导观者的视线沿着一条假想的、穿过画面的“光通道”，从一个亮点跳到另一个亮点。"'
  domain: 构图与结构
- id: m20
  page: p111
  type: principle
  claim: 地平线靠近上边框给人俯瞰大地的印象，靠近下边框则给人仰视苍穹的印象；机位高低先于构图细节决定空间态度。
  source_chapter: p111 + 空间和视平线
  quote: '"地平线可以设置在画面中任意位置，但放在接近上边框的位置时给人的印象是俯瞰大地，而放在接近下边框的位置时则给人仰视苍穹的印象。"'
  domain: 空间
- id: m21
  page: p113
  type: principle
  claim: 纵深靠多手段叠加：重叠、大小/形状/虚实对比、冷暖与后退色、光影、暗边框；其中光影同时提供轮廓与前后层次，最要紧。
  source_chapter: p113 + 更多创造空间效果的办法
  quote: '"表现空间感和纵深感的方法还有很多，包括使拍摄对象的形状重叠（如照片8、19），引入引人注目的大小对比、形状对比和虚实对比（如照片17），采用前景与背景的冷暖对比，以及后退色的运用（如照片8、11）等。"'
  domain: 空间
- id: m22
  page: p115
  type: principle
  claim: 广角靠增强透视、拉大主体与前后景距离表现空间；长焦不靠透视，靠焦点处清晰与焦外模糊的对比表现重叠与纵深。
  source_chapter: p115 + 镜头及其作用
  quote: '"所有的广角镜头都能通过增强透视效果、改变拍摄对象与前景和背景之间的距离来在二维平面上表现出空间感。而长焦镜头只能通过镜头焦点处的敏锐细节和镜头焦点外的模糊背景的对比来表现形状之间清晰的重叠，表现纵深感。"'
  domain: 空间
- id: m23
  page: p122
  type: principle
  claim: 两个色相只算「有对比」，三种颜色以上才构成真正的色相对比；三原色最响亮，加入第二梯度色可缓和。
  source_chapter: p122 + 色相对比
  quote: '"虽然两个色相之间就能产生对比，但真正的色相对比只有在画面中有三种颜色以上时才有效。"'
  domain: 色相与色环
- id: m24
  page: p127
  type: principle
  claim: 质量对比是纯色与同色系渐暗、渐淡色之间的对比；画面只有一种色彩时效果最好，出现第二种颜色后地位下降。
  source_chapter: p127 + 颜色质量对比
  quote: '"色彩的质量对比是指画面中的纯色和它同色系色彩之间的对比（如图 C 和照片 13~15）。在只有一种色彩展示的时候，质量对比的效果是最好的。"'
  domain: 饱和度
- id: m25
  page: p128
  type: principle
  claim: 曝光不足可视为给画面加黑、过度视为加白，改变的主要是整体色彩平衡而非只动明度；要降纯度应改光或混合，不应靠欠曝。
  source_chapter: p128 + 颜色质量对比
  quote: '"我们可以把曝光不足想成为画面增加黑色，曝光过度想成为画面增加白色，主要改变的是画面整体色彩平衡。"'
  domain: 饱和度
- id: m26
  page: p130
  type: principle
  claim: 人会在不到一秒内扫视全画面；若综合结果是中性灰，观者判定总量平衡，偏某色则会立刻去找失衡原因。
  source_chapter: p130 + 色彩的中性值
  quote: '"如果这样的快速均匀扫描得到的是中性灰这样一个色彩中性值，那么观者会觉得所有值的综合效果是平衡的。"'
  domain: 和谐与协调
- id: m27
  page: p131
  type: principle
  claim: 按歌德亮度值取反得面积和谐值（黄3、橙4、红6、紫9、蓝8、绿6），按反比分配面积：黄:紫=1:3、橙:蓝=1:2。
  source_chapter: p131 + 互补色和它们的数量和谐
  quote: '"因此要使得黄色和紫色之间达到相同的视觉比重，三倍亮度值的黄色所占的空间面积应该是亮度值最低的紫色所占空间面积的三分之一。"'
  domain: 和谐与协调
- id: m28
  page: p133
  type: principle
  claim: 互补色的面积和谐值正好与亮度值相反；这套比例可外推到非互补色与三色组合，但只是理论基准，实际仍靠训练过的眼睛。
  source_chapter: p133 + 互补色和它们的数量和谐
  quote: '"因此互补色的数量和谐值正好和亮度值相反：黄色=3，橙色=4，红色=6，紫色=9，蓝色=8，绿色=6。"'
  domain: 和谐与协调
- id: m29
  page: p135
  type: principle
  claim: 先算和谐比再有意偏离可制造张力：缩小亮色面积、倒置或夸大比例（1:2 变 2:1、3:1）；偏离没有普适最优值。
  source_chapter: p135 + 富于表现力的数量对比
  quote: '"第二类靠倒置甚至夸大彼此的数量比来增强视觉张力。例如，对于和谐比率为1:2的橙色和蓝色来说，可以将数量比变成2:1、3:1或者其他比例关系（如照片13）来增强视觉张力。"'
  domain: 对比
- id: m30
  page: p136
  type: principle
  claim: 冷暖对比的优先级由两色在色相环上的距离决定：相距越远越优先，青与橙红这对最冷/最暖的互补色优先级最高。
  source_chapter: p137 + 冷暖对比
  quote: '"而在色彩的冷暖对比中，决定其优先级的是两个颜色之间的色相对比，即两个颜色之间的色相对比是差异大（在色相环中相距远）还是差异小（在色相环中距离近）。"'
  domain: 冷暖
- id: m31
  page: p147
  type: principle
  claim: 单眼凝视彩色图约二十秒后迅速移视空白中心，会短暂看到结构相同、颜色互补的残像；这是视觉系统自动补缺的互补色。
  source_chapter: p147 + 后像
  quote: '"如果你聚精会神地看，聚焦画面而忽略细节，用一只眼睛看图 C1 20 秒左右，然后迅速将目光移至图 C2 的中心点"'
  domain: 机制
- id: m32
  page: p150
  type: principle
  claim: 色彩协调指两色以上的交互作用在观者脑中融合成中性灰调；融合不出中性灰即为不协调。
  source_chapter: p150 + 色彩协调
  quote: '"“色彩协调”指两种、三种、四种或更多种颜色交互作用，在观者脑海中融合，产生中性灰调，从而形成色调的和谐平衡。"'
  domain: 和谐与协调
- id: m33
  page: p152
  type: principle
  claim: 在十二色相环上取一对互补色，把其中一色替换成左右相邻的两色，可得到三色协调组合（和弦色）。
  source_chapter: p152 + 三色协调
  quote: '"先找到一对在色相环上位置相对的互补色，如橙-红和蓝-绿，然后替换一个颜色，如将蓝-绿替换为与相邻的蓝色和绿色，于是新的色彩组合形成了：橙-红、蓝、绿（如图A和照片1）。"'
  domain: 和谐与协调
- id: m34
  page: p154
  type: principle
  claim: 四色协调可在色相环内接正方形（两组互补色）或长方形取邻近色，各给出三组组合；前提是纯色相，降纯度会同时增强其他对比。
  source_chapter: p154 + 四色协调
  quote: '"通过两对互补色产生四色协调的方式共有两种：一种方法是在十二色相环中画一个正方形，两条对角线连接两组互相垂直的互补色，如一组是黄色和紫色，另一组是蓝-绿和橙-红（如图C）。"'
  domain: 和谐与协调
- id: m35
  page: p158
  type: framework
  claim: 按快门前要逐项拍板八件事：相机、镜头、胶片/数码设置、光线、时间、视角、快门与光圈；每项同时是技术与艺术选择。
  source_chapter: p157 + 主观表现和客观表述
  quote: '"8. 快门速度和光圈选择：这些参数决定了画面中移动物体的清晰度、景深大小，以及整体曝光是否“正确”：是曝光过度还是曝光不足。"'
  domain: 方法论
- id: m36
  page: p161
  type: principle
  claim: 照片成功与否取决于内容而非画面质量；设计出众但内容平庸仍可能失败，设计中庸但内容传达有力反而可能成功。
  source_chapter: p161 + 画面内容：出彩或败笔？
  quote: '"判断艺术家拍摄照片的好坏，取决于照片内容而不是画面质量。"'
  domain: 方法论
- id: m37
  page: p168
  type: principle
  claim: 横向「风景格式」支撑水平线、辽阔与稳定，竖向「人像格式」含垂直线、亲近与温暖；先按关系是辽阔还是亲近定格式。
  source_chapter: p168 + 照片格式
  quote: '"数世纪以来，画家一般都采用横向长方形画风景画，而用竖向长方形画肖像和人物。因此，相对应的格式又被称为“风景格式”和“人像格式”。"'
  domain: 构图与结构
- id: m38
  page: p173
  type: principle
  claim: 失衡要分两组力看：元素与画框边、角、中点的张力，以及元素彼此之间的张力（含色彩重量、色块尺寸、色相）；两组修法不同。
  source_chapter: p173 + 形式平衡
  quote: '"第一组是构图元素和画面边角、中点（类似于磁场力）之间的视觉张力。每个元素在画面中的位置决定了它将把观者的视线牵引到哪里。"'
  domain: 构图与结构
- id: m39
  page: p175
  type: principle
  claim: 正方形既不够宽也不够深，传达不了宽度与纵深；它适合中心/中轴构图与纵横均分，靠平衡而非张力取胜。
  source_chapter: p175 + 正方形格式照片
  quote: '"正方形格式照片由于太窄而无法传达宽度，也由于太矮而无法传达深度。"'
  domain: 构图与结构
- id: m40
  page: p180
  type: principle
  claim: 虚实对比主要作用于前景与背景：焦点对前景则前景凸显，焦点透过前景对背景则前景成虚化引导层，全幅失焦则转为氛围。
  source_chapter: p180 + 镜头设置
  quote: '"第一种情况：当摄影师将焦点对准前景而非背景时，前景清晰、背景模糊，前景从背景中凸显出来，视觉效果得以强化。"'
  domain: 空间
- id: m41
  page: p182
  type: principle
  claim: 想保持运动主体清晰又要动感，就让镜头跟随主体摇摄：主体相对静止、背景拉成方向性模糊；这与固定机位、移动机位是三种不同程序。
  source_chapter: p182 + 长时间曝光
  quote: '"如果想始终保持画面中某部分清晰，而拍摄的是运动物体，就需要使镜头随着运动物体移动进行摇摄。"'
  domain: 器材与后期
- id: m42
  page: p187
  type: principle
  claim: 常见主题的成熟组照应有十到十五张甚至更多；主题越不常见，张数越少，组照质量取决于可供挑选的照片池。
  source_chapter: p187 + 组照的质量
  quote: '"对于普通的自然或人工主题来说，像树木、云朵、窗户、楼梯、篱笆等物体很容易寻找到，因此一个成熟的组照应该由十到十五张甚至更多精挑细选的有趣照片组成。而主题不常见时，组成组照的照片也会随之减少。"'
  domain: 方法论
- id: m43
  page: p187
  type: principle
  claim: 组照以整组为评判单位，单张标准须按整体重定；单看弱的照片放进对的组照里可以成立。
  source_chapter: p187 + 组照的质量
  quote: '"而组照的质量是由所有可供挑选的照片影响的。因此，评判组照中单张照片的标准可能与评判单张照片的标准不同。"'
  domain: 方法论
- id: m44
  page: p190
  type: principle
  claim: 连续摄影冻结除时间外的一切技术条件——视点、取景、曝光都不变，只让时间与自然条件改变画面。
  source_chapter: p190 + 表现时间：连续摄影
  quote: '"连续摄影的原则是：捕捉不变的主线以及随着时间改变的元素。"'
  domain: 方法论
- id: m45
  page: p202
  type: principle
  claim: 分析彩色照片先找出占主导地位的那一种对比，再按占比给其余对比排序；答不出主导对比就说明还没看懂组织方式。
  source_chapter: p202 + 分析形状与色彩
  quote: '"在彩色图片中占据主导地位的形式元素是暖黄色和冷蓝色的互补色对比，甚至超过了所有明暗对比的总和。"'
  domain: 方法论
- id: m46
  page: p203
  type: principle
  claim: 把同一画面的黑白版与彩色版并列评估，分别回答构图靠什么成立、色彩靠什么成立，再判断两者是加强还是抵消。
  source_chapter: p203 + 分析形状与色彩
  quote: '"在同一照片的黑白版本中，构图带给观者的视觉冲击远大于实际效果。而彩色版本中，明暗对比与色彩组合（所占的地位）相匹敌。"'
  domain: 方法论
