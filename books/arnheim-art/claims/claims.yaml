- id: ar01
  claim: 画面中心的稳定不是因为没有力，而是因为来自各个方向的力在这一点上互相抵消；中心是力的平衡点，不是力的缺席。
  page: p026
  quote: 在中心点，所有的力都是相互平衡的，因此，在中心位置上就比较稳定。
  stance: mechanism
  domain: 构图与结构
  operational: principle
  single_source: true
- id: ar02
  claim: 知觉力不是观看者附加的错觉，而是所见事物与图像的真实性质；讨论它叫不叫幻觉不影响这一点。
  page: p030
  quote: 至于我们是否将这种知觉力称为“幻觉”，都是无关紧要的，只要我们承认，知觉力是我们看到的每一事物或图像的真实性质，那就足够了。
  stance: mechanism
  domain: 机制
  operational: principle
  single_source: true
- id: ar03
  claim: 影响视觉平衡的只有两件事：重量与方向。
  page: p038
  quote: 这两种性质就是重力和方向。
  stance: mechanism
  domain: 构图与结构
  operational: principle
  single_source: true
- id: ar04
  claim: 同一元素在画面下方比在上方更稳定；上方的位置天然不稳定，因此放在上方的元素需要更多支撑理由。
  page: p031
  quote: 处在一个较为突出的位置上，即处在一个稳定的中心位置上，而处于上方的那一个圆，则处于一个不太稳定的位置上。
  stance: mechanism
  domain: 构图与结构
  operational: principle
  single_source: true
- id: ar05
  claim: 简化有两层——观者识认起来容易的主观简化，与图形结构特征少的客观简化，两者并不总一致。
  page: p074
  quote: 我们还须通过分析这些图样的形式特征来确定被观看事物的客观简化性。
  stance: mechanism
  domain: 明度
  operational: principle
  single_source: true
- id: ar06
  claim: 视觉在简化时会朝两个方向走：矫平（减少结构差异）与增锐（强化差异）。
  page: p085
  quote: 以上两种倾向，一种可称为“矫平”，另一种则为“增锐”。
  stance: mechanism
  domain: 构图与结构
  operational: principle
  single_source: true
- id: ar07
  claim: 矫平的具体表现是构图更一致、对称度更高、重复的结构特征减少、丢弃不适宜细节、纠正倾斜——这些正是「把画面收拾干净」在知觉层面的含义。
  page: p086
  quote: “矫平”的特征就是使构图更一致、使对称程度更高、使结构特征减少重复、丢弃不适宜的细节、将倾斜纠正等。
  stance: mechanism
  domain: 构图与结构
  operational: procedure
  single_source: true
- id: ar08
  claim: 画面被切分时，更简单的整体会压过部分——正方形切成两半仍被读成正方形，因为 1:1 比两个 1:2 更简单。
  page: p090
  quote: 当正方形图43a被细分为两半时，整体（正方形）压倒了它的部分（半图），因为这个具有1:1的对称性的正方形比两个1：2的长方形更为简单。
  stance: mechanism
  domain: 构图与结构
  operational: principle
  single_source: true
- id: ar09
  claim: 轮廓线不等于形状；形状由结构骨架决定，而结构骨架很少与轮廓重合。
  page: p111
  quote: 虽然一个物体的视觉形状多半是由其轮廓线确定的，但轮廓线并不等于其形状。
  stance: mechanism
  domain: 构图与结构
  operational: principle
  single_source: true
- id: ar10
  claim: 形状越连贯，越容易从背景中独立出来；反之，难以与背景分离的形状往往是不对称、不规则或与背景交织的。
  page: p104
  quote: 一个构图单位的形状愈是连贯，它就愈易于从它所处的背景中独立出来。
  stance: mechanism
  domain: 构图与结构
  operational: principle
  single_source: true
- id: ar11
  claim: 梯度创造深度这一发现的源头是吉布森；倾斜之所以产生深度，是因为它被读成一个梯度，而不只是偏离了垂直—水平框架。
  page: p300
  quote: 第一个使人意识到梯度具有创造深度能力的人是吉布孙(JamesJ.Gibson)。
  stance: mechanism
  domain: 空间
  operational: principle
  single_source: true
- id: ar12
  claim: 画框在图底关系里是「图」，画面空间是它下方的无边基底；这就是框架被称作窗口的心理学依据。
  page: p264
  quote: 正是在这个意义上，一幅画的框架才被称之为一个窗口。
  stance: mechanism
  domain: 空间
  operational: principle
  single_source: true
- id: ar13
  claim: 相对亮度只有在整个环境被同一强度光照亮时才能被稳定知觉；局部光照变化会让亮度读成别的东西。
  page: p331
  quote: 当整个环境被置于同样强的光线之下时，物体的相对亮度就可以被稳定地知觉到。
  stance: mechanism
  domain: 光与时段
  operational: principle
  single_source: true
- id: ar14
  claim: 明暗渐变一旦让观者看出一块圆面有曲率，它就立刻被读成球体的一部分——阴影不是装饰，是形状的构造者。
  page: p136
  quote: 如果通过明暗阴影看出这一圆面有一定的曲率，我们就会把它看成一个球体的一部分。
  stance: mechanism
  domain: 光与时段
  operational: principle
  single_source: true
- id: ar15
  claim: 一切视觉形象都产生于色彩与亮度这两件事，没有第三种原料。
  page: p358
  quote: 严格说来，一切视觉形象都产生于色彩和亮度。
  stance: mechanism
  domain: 色相与色环
  operational: principle
  single_source: true
- id: ar16
  claim: 一个色彩的全部特性（冷暖、鲜明暗淡）会单方面影响观者，并仅凭其出现就指向另一种与之不同的存在——冷暖不是装饰性形容词，是关系。
  page: p387
  quote: 这一特定色彩的所有特性，如冷或暖、鲜明或暗淡等，都会单方面地影响我们，并仅仅凭借其出现而指向另一种与之不同的存在。
  stance: mechanism
  domain: 冷暖
  operational: principle
  single_source: true
- id: ar17
  claim: 只让平衡与和谐主导作品，等于对人类经验做出片面解释——平衡是常态，不是目标。
  page: p054
  quote: 如果一个艺术家让平衡与和谐主导自己创作的作品时，就等于是对人类经验做出片面的解释。
  stance: mechanism
  domain: 和谐与协调
  operational: principle
  single_source: true
  contested_hint: K1
- id: ar18
  claim: 人看到的首先不是事物、色彩、形状或大小，而是方向性张力之间的相互作用——张力是知觉的第一层，不是修辞。
  page: p024
  quote: 一个人或一个动物看到的，不仅仅是那种事物，亦不仅仅是它的色彩、形状、动作和大小，而首先是方向性张力间的相互作用。
  stance: mechanism
  domain: 构图与结构
  operational: principle
  single_source: true
- id: ar19
  claim: 艺术家的目的是让观者经验到各种「力」的作用式样的表现性质——这解释了为什么有些画面「有劲儿」而有些没有。
  page: p182
  quote: 艺术家的目的，就是让观赏者经验到各种“力”的作用式样的表现性质。
  stance: mechanism
  domain: 情绪与象征
  operational: principle
  single_source: true
- id: ar20
  claim: 视觉形象从来不是对感性材料的机械复制，而是对现实的创造性把握。
  page: p011
  quote: 所有这些试验都证明了，视觉形象永远不是对于感性材料的机械复制，而是对现实的一种创造性把握，它把握到的形象是含有丰富的想象性、创造性、敏锐性的美的形象。
  stance: mechanism
  domain: 机制
  operational: principle
  single_source: true
- id: ar21
  claim: 整体不能通过各部分相加来达到——这是格式塔给构图的第一条硬约束，也是「元素清单式点评」失效的原因。
  page: p011
  quote: 对于大多数艺术家来说，“整体不能通过各部分相加的和来达到”的思想，并不算什么新奇的东西了。
  stance: mechanism
  domain: 机制
  operational: principle
  single_source: true
- id: ar22
  claim: 一件平衡的构图里，形状、方向、位置的关系确定到不允许任何微改——这就是「已经到位」的可操作判据。
  page: p035
  quote: 也就是说，对于一件平衡的构图来说，其形状、方向、位置诸要素之间的关系，都达到了如此确定的程度，以至于不允许这些要素有任何些微的改变。
  stance: mechanism
  domain: 构图与结构
  operational: metric
  single_source: true
- id: ar23
  claim: 视觉平衡值与物理量往往不一致——大小、色彩、方向造成的「视觉重量」不能按像素面积直接换算。
  page: p032
  quote: 原因在于：诸如大小、色彩、方向等因素造成的视觉平衡值，往往与相对应的物理因素不一致。
  stance: mechanism
  domain: 构图与结构
  operational: principle
  single_source: true
- id: ar24
  claim: 知觉过程本身就是「知觉概念」的形成过程——看不是收集像素，是抓突出结构特征。
  page: p064
  quote: 如果以上描述是有效的，我们就不得不承认，知觉过程就是“知觉概念”形成的过程。
  stance: mechanism
  domain: 机制
  operational: principle
  single_source: true
- id: ar25
  claim: 重叠中被盖住的那一层，是靠「在深度上分离」来摆脱干扰的——重叠要读成前后，必须给出分离线索。
  page: p472
  quote: 正如我在前面所说过的，在重叠式样中，那被掩盖的式样往往通过在深度上的分离来摆脱掩盖者的干扰。
  stance: mechanism
  domain: 空间
  operational: principle
  single_source: true
- id: ar26
  claim: 世界上不存在真正的平面绘画——只要在平面上组织图形，深度关系就已被卷入。
  page: p253
  quote: 根本就不存在真正的平面的或二度的绘画。
  stance: mechanism
  domain: 空间
  operational: principle
  single_source: true
- id: ar27
  claim: 画面中心那个「看不见的点」可以被探测出来，就像铁屑显示磁场——先贴一个标记物，隐藏结构才显形。
  page: p025
  quote: 我们可以通过在其中粘贴上一个黑色圆面的方式，将这个隐藏的中心点探测出来，就像用铁屑把一个磁场的磁力线显示出来一样。
  stance: mechanism
  domain: 构图与结构
  operational: procedure
  single_source: true
