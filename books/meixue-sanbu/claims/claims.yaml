- id: ms01
  page: p129
  type: framework
  claim: 郭熙《林泉高致·山川训》三远定义：仰山巅为高远、窥山后为深远、望远山为平远
  source_chapter: p129
  quote: 山有三远：自山下而仰山巅，谓之高远。自山前而窥山后，谓之深远。自近山而望远山，谓之平远。
  domain: 空间
- id: ms02
  page: p129
  type: framework
  claim: 西洋透视法：在画面上依几何学测算构造三进向的空间幻景，一切视线集结于一个焦点
  source_chapter: p129
  quote: 西洋画法上的透视法是在画面上依几何学的测算构造一个三进向的空间的幻景。一切视线集结于一个焦点
  domain: 空间
- id: ms03
  page: p129
  type: principle
  claim: 三远的关键差别：对同一片山景，中国画的视线是流动的、转折的
  source_chapter: p129
  quote: 而中国“三远”之法，则对于同此一片山景“仰山巅，窥山后，望远山”，我们的视线是流动的，转折的。
  domain: 空间
- id: ms04
  page: p129
  type: principle
  claim: 由高转深、由深转近、再横向于平远——三远是一个节奏化的行动
  source_chapter: p129
  quote: 由高转深，由深转近，再横向于平远，成了一个节奏化的行动。
  domain: 空间
- id: ms05
  page: p131
  type: framework
  claim: 三远所构空间不是几何学的科学透视空间，而是诗意的创造性的艺术空间
  source_chapter: p131
  quote: 由这“三远法”所构的空间不复是几何学的科学性的透视空间，而是诗意的创造性的艺术空间。
  domain: 空间
- id: ms06
  page: p131
  type: principle
  claim: 华琳的「推」法：远不靠堆叠穿斲，靠「似离而合」
  source_chapter: p131
  quote: “似离而合”四字实推之神髓。
  domain: 空间
- id: ms07
  page: p131
  type: principle
  claim: 宗白华按语：西洋透视法是以离为推
  source_chapter: p131
  quote: 案西洋透视法是以离为推也
  domain: 空间
- id: ms08
  page: p132
  type: principle
  claim: 中国画台阶楼梯上宽下窄——是从远向近看、从高向下看，不是画错透视
  source_chapter: p132
  quote: 而中国画在画台阶、楼梯时反而都是上宽而下窄
  domain: 空间
- id: ms09
  page: p132
  type: framework
  claim: 「以大观小」：从既高且远的心灵的眼睛俯仰宇宙
  source_chapter: p132
  quote: 我们从既高且远的心灵的眼睛“以大观小”，俯仰宇宙
  domain: 空间
- id: ms10
  page: p132
  type: principle
  claim: 「折高折远自有妙理」：位置不依几何三角透视规定
  source_chapter: p132
  quote: 而是如沈括所说的“折高折远自有妙理”
  domain: 空间
- id: ms11
  page: p132
  type: principle
  claim: 虚与实联成一片波流：画面空间自己参加进全幅节奏
  source_chapter: p132
  quote: 虚（空间）同实（实物）联成一片波流，如决流之推波。
  domain: 空间
- id: ms12
  page: p133
  type: framework
  claim: 透视学是站在一个固定地点看出去的主观景界
  source_chapter: p133
  quote: 透视学是研究人站在一个固定地点看出去的主观景界
  domain: 空间
- id: ms13
  page: p131
  type: framework
  claim: 三远与西洋透视「大相径庭」：一个俯仰往还，一个从固定角度把握一远
  source_chapter: p131
  quote: 这与西洋透视法从一固定角度把握“一远”，大相径庭。
  domain: 空间
- id: ms14
  page: p107
  type: framework
  claim: 荀子「不全不粹不足以谓之美」：艺术既要全面地表现，又要提炼去粗存精
  source_chapter: p107
  quote: 不全不粹不足以谓之美
  domain: 构图与结构
- id: ms15
  page: p111
  type: framework
  claim: 笪重光《画筌》：虚实相生，无画处皆成妙境
  source_chapter: p111
  quote: 虚实相生，无画处皆成妙境。
  domain: 空间
- id: ms16
  page: p111
  type: principle
  claim: 空本难图：实景清而空景才能现；神无可绘，真境逼而神境生
  source_chapter: p111
  quote: 空本难图，实景清而空景现。神无可绘，真境逼而神境生。
  domain: 空间
- id: ms17
  page: p108
  type: principle
  claim: 神龙见首不见尾：一鳞一爪要有象征力量，使全体宛然存在
  source_chapter: p108
  quote: 神龙者，屈伸变化，固无定体
  domain: 构图与结构
- id: ms18
  page: p112
  type: case
  claim: 八大山人画一条鱼，别无一物，却令人感到满幅是水
  source_chapter: p112
  quote: 八大山人画一条生动的鱼在纸上，别无一物，令人感到满幅是水
  domain: 构图与结构
- id: ms19
  page: p102
  type: principle
  claim: 空亭：山川灵气动荡吐纳的交点与精神聚积的处所
  source_chapter: p102
  quote: 一座空亭竟成为山川灵气动荡吐纳的交点和山川精神聚积的处所
  domain: 构图与结构
- id: ms20
  page: p138
  type: framework
  claim: 中国画的虚白不是几何学间架、不是死空间，不是「顽空」
  source_chapter: p138
  quote: 这个虚白不是几何学的空间间架，死的空间，所谓顽空
  domain: 空间
- id: ms21
  page: p138
  type: principle
  claim: 苏东坡：「静故了群动，空故纳万境」——空是为了容纳与容纳后的动
  source_chapter: p138
  quote: 静故了群动，空故纳万境
  domain: 空间
- id: ms22
  page: p124
  type: principle
  claim: 宗白华判断：中国人对无穷空间的特殊态度，阻碍了透视法的发明
  source_chapter: p124
  quote: 阻碍中国人去发明透视法
  domain: 空间
