- id: so01
  page: "p017"
  type: framework
  claim: "观看看的是预期与画面的差：先说出你预期看到什么，再按下去拍，照片才有可读的内容。"
  source_chapter: "导论 · 1 秩序与方向"
  quote: "有机体必须细察它周围的环境，而且似乎还必须对照它最初对规律运动和变化所做的预测来确定它所接受到的信息的含义。"
  domain: "机制"
- id: so02
  page: "p019"
  type: principle
  claim: "一张显得整齐的照片，得先让人看见它周围的乱；没有乱的底子，秩序不会被看见。"
  source_chapter: "导论 · 3 自然的图案"
  quote: "正是混乱与秩序之间的对照唤醒了我们的知觉。"
  domain: "对比"
- id: so03
  page: "p022"
  type: mechanism
  claim: "画面一旦符合预期，眼睛就撤走注意力；凡是「一眼看懂」的照片都不会被再看第二眼。"
  source_chapter: "导论 · 6 单调与多样"
  quote: "就会停止对它的注意，它就会沉到我们的意识阈限之下去。"
  domain: "机制"
- id: so04
  page: "p023"
  type: mechanism
  claim: "照片的信息量等于它违背预期的程度；整张都合乎构图法则，等于没有信息。"
  source_chapter: "导论 · 6 单调与多样"
  quote: "信息量的大小是根据意外程度的高低来衡量的。"
  domain: "机制"
- id: so05
  page: "p023"
  type: principle
  claim: "照片两头都不讨好：太齐整让人乏味，太杂乱让人不再看，该停在两者之间。"
  source_chapter: "导论 · 6 单调与多样"
  quote: "审美经验方面的一个最基本事实，即愉悦在于乏味和杂乱之间"
  domain: "和谐与协调"
- id: so06
  page: "p027"
  type: case
  claim: "拍一组题材不必停手，而是在同一套式样里逐张加一点新变，单调才被打破。"
  source_chapter: "导论 · 8 游戏与艺术"
  quote: "打破单调的方法不是停下来不做，而是在常规的游戏中加点新的花样，以增加乐趣。"
  domain: "方法论"
- id: so07
  page: "p127"
  type: mechanism
  claim: "画面里最容易被看见的，不是重复出现的纹理，而是纹理忽然断掉的那一处。"
  source_chapter: "第四章 视觉的节省 · 3 清晰度的消失"
  quote: "在这儿就像在远景里一样，视觉延续的中断最容易引起注意。"
  domain: "对比"
- id: so08
  page: "p138"
  type: mechanism
  claim: "想让一个元素成为视觉重点，就给它一处间断：密度变了、方向变了，它自然跳出来。"
  source_chapter: "第四章 视觉的节省 · 8 作为显著点的中断"
  quote: "视觉显著点的效果和力量都源于延续的间断，不管是结构密度上的间断、成分排列方向上的间断，还是其他无数种引人注目的间断。"
  domain: "构图与结构"
- id: so09
  page: "p138"
  type: mechanism
  claim: "眼睛只对分布的变化报警；全画面同一密度、同一方向的照片，眼睛会整张跳过。"
  source_chapter: "第四章 视觉的节省 · 8 作为显著点的中断"
  quote: "为了节省注意力，感官系统只监测能引起新的警觉的刺激分布变化。"
  domain: "机制"
- id: so10
  page: "p139"
  type: mechanism
  claim: "重复物按规则逐渐变小、变密，人就读出纵深；把这种递减打断，空间立刻变平。"
  source_chapter: "第四章 视觉的节省 · 9 秩序与生存"
  quote: "这些重复成分有规则地减少所造成的透视效果为我们在空间的定位提供了重要的暗示。"
  domain: "空间"
- id: so11
  page: "p141"
  type: principle
  claim: "熟悉的东西在熟悉的位置上不会被看见；把它挪到陌生的场合，注意才会回来。"
  source_chapter: "第四章 视觉的节省 · 9 秩序与生存"
  quote: "熟悉的东西就成了预期的东西，因而被我们当成读解过的东西，除非它出现在一个不熟悉的场合，而引起我们的注意。"
  domain: "语境与相对性"
- id: so12
  page: "p144"
  type: principle
  claim: "丰富和混乱不必逐个数；第一眼的一瞥就该能分出这是密而不乱，还是乱而无序。"
  source_chapter: "第四章 视觉的节省 · 10 整体知觉"
  quote: "我们无须逐一检验，而只要凭感觉就能区分什么是丰富，什么是混乱。"
  domain: "方法论"
- id: so13
  page: "p146"
  type: mechanism
  claim: "同一构图缩小只剩质地，放大才见秩序；同一处细节在成片与放大里是两张照片。"
  source_chapter: "第五章 效果的分析 · 1 美学的局限"
  quote: "把这件设计缩小到无法辨认的程度，它就仅能显示出质地；如果把它放大，那么质地中隐藏着的秩序就会表现出来"
  domain: "数量与面积"
- id: so14
  page: "p150"
  type: mechanism
  claim: "照片让人「被牵引」而找不到停落点，就是不安：观者的眼一直走，落不下来。"
  source_chapter: "第五章 效果的分析 · 2 不安与平静"
  quote: "如果某个设计使我们感到“被牵引”，我们称它为“不安”。"
  domain: "构图与结构"
- id: so15
  page: "p151"
  type: mechanism
  claim: "不是那处亮点抓住你，是你在主动找它；构图要给眼睛一条找得到的路，而不是只放一个亮块。"
  source_chapter: "第五章 效果的分析 · 2 不安与平静"
  quote: "客观地说，不是中断在吸引眼睛，而是眼睛在寻找中断。"
  domain: "机制"
- id: so16
  page: "p155"
  type: framework
  claim: "画框是一次「延续的中断」：它划出范围，并预先告诉观者框内值得细看。"
  source_chapter: "第五章 效果的分析 · 2 不安与平静"
  quote: "框架既可以界定装饰者和观赏者的活动范围，又是一种将设计与其周围的环境区分开来的“延续的”中断。"
  domain: "构图与结构"
- id: so17
  page: "p158"
  type: mechanism
  claim: "对称画面里，中轴是唯一没重复的地方，所以它必然吸眼；主体压中轴，就得承担这个重量。"
  source_chapter: "第五章 效果的分析 · 3 平衡与不稳定"
  quote: "在双边对称图形中，中心轴必须是一种“吸引眼睛的磁铁”，因为从定义上说，它是序列中唯一没重复的部分。"
  domain: "构图与结构"
- id: so18
  page: "p159"
  type: counter-example
  claim: "对称与齐整之所以死板，是因为冗余过量；每一处都被预料到，就再没有东西可看。"
  source_chapter: "第五章 效果的分析 · 3 平衡与不稳定"
  quote: "完美显得“死板”，因为它有过量的冗余度。"
  domain: "和谐与协调"
- id: so19
  page: "p162"
  type: mechanism
  claim: "读图从边缘开始向里走；边缘先给出基调，观者才按这个基调去读中心。"
  source_chapter: "第五章 效果的分析 · 3 平衡与不稳定"
  quote: "这儿，我们再次看到了这样一种倾向：我们看图时是从外向里看的。"
  domain: "构图与结构"
- id: so20
  page: "p172"
  type: principle
  claim: "相邻两块颜色会把彼此的差异拉大：想让某色更艳，就挨着它的对立面放。"
  source_chapter: "第五章 效果的分析 · 6 色彩"
  quote: "当眼睛同时看到两种邻近的颜色时，这两种颜色在光学结构和色调的高低上都会尽量显得不相同。"
  domain: "对比"
- id: so21
  page: "p180"
  type: framework
  claim: "人看的先是「是什么」，不是「怎么排」；东西一旦被认成实物，图案就读不出来了。"
  source_chapter: "第六章 图形与事物 · 1 万花筒"
  quote: "感官接受的是生动的图案，但是，我们很少看图案，我们看的是事物。"
  domain: "机制"
- id: so22
  page: "p180"
  type: mechanism
  claim: "只要露出一小段就能推知整体，眼睛就不再有活干；重复图案要藏一点，让人推不完。"
  source_chapter: "第六章 图形与事物 · 1 万花筒"
  quote: "只要看到图案的一小部分我们就知道了整个图案的样子，这样，眼睛就没有什么东西好探索的了。"
  domain: "机制"
- id: so23
  page: "p182"
  type: mechanism
  claim: "一个特征重复够多就只剩图案，个体性消失；拍人像时不该让相似的脸并排成列。"
  source_chapter: "第六章 图形与事物 · 2 重复与意义"
  quote: "而这些成分就像在万花筒中一样，已经并入了一个新的更大的图案。一排重复的眼睛不再是某个人独特的眼睛。"
  domain: "数量与面积"
- id: so24
  page: "p187"
  type: mechanism
  claim: "同一颗果在边上只算装饰，在中心就成了实物；位置决定观者把它当主体还是当旁物。"
  source_chapter: "第六章 图形与事物 · 3 「力场」"
  quote: "蛋糕边上的樱桃是装饰品，而蛋糕中心的樱桃却让人觉得是一颗实实在在的樱桃"
  domain: "构图与结构"
- id: so25
  page: "p188"
  type: mechanism
  claim: "对称会逼人给意义：一块偶然的墨迹一旦对折成对称，观者就非解释它不可。"
  source_chapter: "第六章 图形与事物 · 4 投射与生命化"
  quote: "对折后的墨迹成了对称的图形，看上去不再是一个偶然形成的图形，因而它迫使我们对它做出一种有意义的解释"
  domain: "情绪与象征"
- id: so26
  page: "p201"
  type: principle
  claim: "换一种裁切形状，框里的东西就换一种意思；同一张底片，方框与竖框读法不同。"
  source_chapter: "第六章 图形与事物 · 6 装饰身体"
  quote: "还有，框架的形状可以改变框架中物体的意义。"
  domain: "构图与结构"
- id: so27
  page: "p294"
  type: framework
  claim: "把不相干的东西并置一处，观者会找不到范畴来归类；这股卡住的力量正是怪诞的效力来源。"
  source_chapter: "第十章 混乱的边界 · 1 艺术破格的特区"
  quote: "任何人若想作梦幻画，他必须把所有东西都混为一体。"
  domain: "语境与相对性"
- id: so28
  page: "p308"
  type: mechanism
  claim: "只要有两三个像眼睛的形状，人就会读成一张脸；石纹、云、树影里冒出来的脸都是这么来的。"
  source_chapter: "第十章 混乱的边界 · 4 难以捉摸的面具"
  quote: "假如有一种心理意向可以被我们确定的话，那就是我们总是易于把图案中那些看上去隐约像眼睛和其他相应的面部特征的图形当作脸孔。"
  domain: "情绪与象征"
- id: so29
  page: "p328"
  type: principle
  claim: "好的模糊是「系统的多义」：同一批形状在两种读法里都立得住；随机糊掉只是没拍清。"
  source_chapter: "第十章 混乱的边界 · 8 形式的解体"
  quote: "这些既不像鱼又不像禽鸟，既不像骨头又不像肌肉的形状可以产生系统的多义性"
  domain: "语境与相对性"
- id: so30
  page: "p330"
  type: principle
  claim: "边框、前景、配角的活儿是突出主体；一旦自己抢眼，就把观者的注意力带离画面。"
  source_chapter: "第十章 混乱的边界 · 8 形式的解体"
  quote: "这只金底画框的设计者绝不想把人们的注意力从珍贵的圣母像引到画框的花饰上去，相反，他正是要突出画面"
  domain: "构图与结构"
